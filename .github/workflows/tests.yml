name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, sodium, mbstring, gd
          tools: phpunit:10

      - name: Symcon-Stubs holen
        run: git clone --depth 1 https://github.com/symcon/SymconStubs.git tests/stubs

      - name: Syntax aller PHP-Dateien prüfen
        run: find . -name '*.php' -not -path './tests/stubs/*' -print0 | xargs -0 -n1 php -l

      - name: JSON-Dateien prüfen
        run: for f in library.json */module.json */form.json */locale.json; do php -r "json_decode(file_get_contents('$f'), false, 512, JSON_THROW_ON_ERROR);" && echo "ok $f"; done

      - name: Tests ausführen (Modul-Validierung + Funktionstests gegen nachgebaute Cloud)
        run: phpunit --configuration phpunit.xml
